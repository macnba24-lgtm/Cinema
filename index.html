<style>
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F3F1EF;
  --ink:#1B120C; --ink-2:#5E534B; --line:rgba(27,18,12,.08);
  --orange:#F26A1B; --orange-ink:#1A0B02; --action:#C2410C; --action-hover:#A93A0B; --on-action:#FFFFFF;
  --au:#E2600F; --ale:#9A3412;
  --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A0A0B; --surface:#151414; --surface-2:#1E1C1B;
    --ink:#F6F1EC; --ink-2:#A79C93; --line:rgba(255,255,255,.08);
    --action:#F26A1B; --action-hover:#FF7D30; --on-action:#1A0B02;
    --au:#CC8018; --ale:#AE360A;
  }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;padding-bottom:112px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* Hero */
.hero{background:var(--orange);color:var(--orange-ink);padding:32px 0 28px;border-radius:0 0 28px 28px}
.hero h1{font-size:32px;font-weight:800;letter-spacing:.08em;line-height:1;text-align:center;padding-left:.08em}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin-top:28px}
.duel .who{font-size:14px;font-weight:600;opacity:.8}
.duel .avg{font-size:56px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.duel .right{text-align:right}
.duel .vs{font-size:14px;font-weight:600;opacity:.6;padding-bottom:8px}
.meter{position:relative;height:8px;border-radius:8px;background:rgba(26,11,2,.15);margin-top:16px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--orange-ink);border-radius:8px;transition:width .5s ease}
.hero .foot{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;margin-top:8px;opacity:.75}

/* Tabs + toolbar */
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--r-md)}
.seg button{flex:1;min-height:44px;border:0;background:transparent;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tabs{margin-top:20px}
.tools{display:flex;flex-direction:column;gap:12px;margin:16px 0 8px}
.search{width:100%;height:48px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:0 16px}
.search::placeholder{color:var(--ink-2)}

/* List */
.list{list-style:none;padding:0;margin-top:8px}
.row{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 4px;min-height:44px}
.row:hover{background:var(--surface-2)}
.row:active{background:var(--line)}
.row-top{display:flex;align-items:baseline;gap:12px}
.title{flex:1;font-size:16px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.title svg{width:14px;height:14px;vertical-align:-1px;margin-left:6px;color:var(--ink-2)}
.scores{display:flex;gap:16px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.scores span{min-width:44px;text-align:right;white-space:nowrap}
.scores span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.s-au::before{background:var(--au)} .s-ale::before{background:var(--ale)}
.track{position:relative;height:16px;margin-top:8px}
.track::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line);border-radius:2px}
.gap{position:absolute;top:7px;height:2px;background:var(--ink-2);opacity:.35}
.dot{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;margin-left:-6px;box-shadow:0 0 0 2px var(--bg)}
.dot.au{background:var(--au)} .dot.ale{background:var(--ale)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--ink-2);margin:8px 4px 0}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}

.skel{height:72px;border-bottom:1px solid var(--line);padding:16px 4px}
.skel div{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface-2) 0,var(--line) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.skel div+div{width:60%;margin-top:12px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 16px;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.note{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-md);padding:12px 16px;margin-top:16px}

/* Stats */
.stats{margin-top:16px;display:flex;flex-direction:column;gap:32px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:var(--r-md);padding:16px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-0.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:14px;color:var(--ink-2);margin-top:4px}
.block h3{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.block > p{font-size:14px;color:var(--ink-2);margin-top:4px}
.split{display:flex;gap:2px;height:16px;margin-top:16px}
.split i{display:block;height:100%;border-radius:4px;min-width:4px}
.split .au{background:var(--au)} .split .ale{background:var(--ale)} .split .eq{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.split-leg{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.split-leg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.hist{position:relative;margin-top:16px}
.hist svg{display:block;width:100%;height:auto;overflow:visible}
.hist .lbl{font-size:12px;fill:var(--ink-2)}
.hist .grid{stroke:var(--line);stroke-width:1}
.hist .hit{fill:transparent;cursor:default}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:14px;padding:8px 12px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.rank{list-style:none;padding:0;margin-top:8px}
.rank li{display:flex;align-items:baseline;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rank .pos{width:20px;color:var(--ink-2);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.rank .t{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rank .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank .sub{font-size:14px;color:var(--ink-2);font-weight:500;margin-left:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:420px){.two{grid-template-columns:1fr}.tile .v{font-size:24px}}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;height:56px;padding:0 28px;border:0;border-radius:28px;background:var(--action);color:var(--on-action);font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(194,65,12,.3)}
.fab:hover{background:var(--action-hover)}
.fab:active{transform:translateX(-50%) scale(.97)}
.fab:disabled{opacity:.4;cursor:not-allowed}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,11,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px 28px;animation:up .22s ease}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h2{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.field{margin-top:20px}
.field label,.field .lab{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.field input[type=text],.field textarea{width:100%;border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg);padding:12px 14px}
.field input[type=text]{height:48px}
.field textarea{min-height:72px;resize:vertical;line-height:1.5}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-2)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:4px}
.step button{width:44px;height:44px;border:0;border-radius:var(--r-sm);background:var(--surface-2);font-size:20px;font-weight:600;flex:none}
.step button:hover{background:var(--line)}
.step input{flex:1;min-width:0;width:100%;height:44px;border:0;background:transparent;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--ink-2);margin-top:8px}
.who-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.cmt + .cmt{margin-top:12px}
.err{font-size:14px;color:#D92D20;margin-top:12px;min-height:20px}
.actions{display:flex;gap:12px;margin-top:8px}
.btn{flex:1;height:48px;border-radius:var(--r-md);border:0;font-weight:700}
.btn.primary{background:var(--action);color:var(--on-action)}
.btn.primary:hover{background:var(--action-hover)}
.btn.ghost{background:var(--surface-2)}
.btn.ghost:hover{background:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.del{display:block;margin:16px auto 0;background:none;border:0;color:#D92D20;font-weight:600;font-size:14px;min-height:44px;padding:0 12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>CINEMA</h1>
    <div class="duel" aria-live="polite">
      <div><div class="who">Aurorilus</div><div class="avg" id="avgAu">–</div></div>
      <div class="vs">media</div>
      <div class="right"><div class="who">Ale</div><div class="avg" id="avgAle">–</div></div>
    </div>
    <div class="meter" aria-hidden="true"><i id="agreeBar" style="width:0"></i></div>
    <div class="foot"><span id="agreeTxt">Sintonia</span><span id="count">0 film</span></div>
  </div>
</header>

<main class="wrap">
  <div class="seg tabs" role="tablist" aria-label="Sezioni">
    <button role="tab" id="tabFilm" aria-selected="true" aria-controls="viewFilm">Film</button>
    <button role="tab" id="tabStats" aria-selected="false" aria-controls="viewStats">Statistiche</button>
  </div>

  <section id="viewFilm" role="tabpanel" aria-labelledby="tabFilm">
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Cerca un film" aria-label="Cerca un film">
      <div class="seg" role="group" aria-label="Ordina">
        <button data-sort="recent" aria-pressed="true">Recenti</button>
        <button data-sort="best" aria-pressed="false">Migliori</button>
        <button data-sort="fight" aria-pressed="false">Più litigati</button>
      </div>
    </div>
    <div class="legend" aria-hidden="true"><span><b style="background:var(--au)"></b>Aurorilus</span><span><b style="background:var(--ale)"></b>Ale</span></div>
    <ul class="list" id="list">
      <li class="skel"><div></div><div></div></li>
      <li class="skel"><div></div><div></div></li>
      <li class="skel"><div></div><div></div></li>
      <li class="skel"><div></div><div></div></li>
    </ul>
  </section>

  <section id="viewStats" role="tabpanel" aria-labelledby="tabStats" hidden>
    <div class="stats" id="stats"></div>
  </section>
  <div id="status"></div>
</main>

<button class="fab" id="add">Aggiungi film</button>

<div class="scrim" id="scrim">
  <form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <h2 id="sheetTitle">Nuovo film</h2>
    <div class="field">
      <label for="fTitle">Titolo</label>
      <input type="text" id="fTitle" autocomplete="off" maxlength="80">
    </div>
    <div class="field pair">
      <div>
        <label for="fAu"><span class="who-dot" style="background:var(--au)"></span>Aurorilus</label>
        <div class="step"><button type="button" data-t="fAu" data-d="-0.5" aria-label="Aurorilus, meno mezzo punto">−</button><input type="text" id="fAu" inputmode="decimal" placeholder="–"><button type="button" data-t="fAu" data-d="0.5" aria-label="Aurorilus, più mezzo punto">+</button></div>
      </div>
      <div>
        <label for="fAle"><span class="who-dot" style="background:var(--ale)"></span>Ale</label>
        <div class="step"><button type="button" data-t="fAle" data-d="-0.5" aria-label="Ale, meno mezzo punto">−</button><input type="text" id="fAle" inputmode="decimal" placeholder="–"><button type="button" data-t="fAle" data-d="0.5" aria-label="Ale, più mezzo punto">+</button></div>
      </div>
    </div>
    <p class="hint">Da 0 a 10. Vanno bene anche 7+, 6- o 7/8. Lascia vuoto se uno dei due non l'ha ancora visto.</p>
    <div class="field">
      <span class="lab">Commenti</span>
      <div class="cmt"><label for="cAu" class="lab"><span class="who-dot" style="background:var(--au)"></span>Aurorilus</label><textarea id="cAu" maxlength="500" placeholder="Aggiungi un commento"></textarea></div>
      <div class="cmt"><label for="cAle" class="lab"><span class="who-dot" style="background:var(--ale)"></span>Ale</label><textarea id="cAle" maxlength="500" placeholder="Aggiungi un commento"></textarea></div>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">Annulla</button>
      <button type="submit" class="btn primary" id="save">Salva</button>
    </div>
    <button type="button" class="del" id="del" hidden>Elimina film</button>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $ = s => document.querySelector(s);
let db = null, films = [], sort = "recent", query = "", editing = null, canWrite = true, confirmDel = false, tab = "film";
const ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-label="ha commenti" role="img"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" stroke-linejoin="round"/></svg>`;

// "7+" -> 7.25, "6-" -> 5.75, "4/5" -> 4.5
function num(v){
  if(v == null) return null;
  const s = String(v).trim().replace(",", ".");
  if(!s) return null;
  let m = s.match(/^(\d{1,2}(?:\.\d+)?)\s*\/\s*(\d{1,2}(?:\.\d+)?)$/);
  if(m) return (parseFloat(m[1]) + parseFloat(m[2])) / 2;
  m = s.match(/^(\d{1,2}(?:\.\d+)?)\s*([+-]?)$/);
  if(!m) return NaN;
  let n = parseFloat(m[1]);
  if(m[2] === "+") n += .25; if(m[2] === "-") n -= .25;
  return n;
}
const ok = n => n != null && !isNaN(n);
const valid = v => { const n = num(v); return n === null || (!isNaN(n) && n >= 0 && n <= 10); };
const fmt = n => n == null ? "–" : (Math.round(n * 10) / 10).toString().replace(".", ",");
const show = v => (v == null || v === "") ? "–" : String(v).replace(".", ",");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null;
const mean = f => { const v = [f.a, f.b].filter(ok); return v.length ? avg(v) : -1; };
const diff = f => ok(f.a) && ok(f.b) ? Math.abs(f.a - f.b) : -1;

function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800); }

function enriched(){ return films.map(f => ({...f, a:num(f.au), b:num(f.ale)})); }

function render(){
  const all = enriched();
  $("#avgAu").textContent = fmt(avg(all.map(f => f.a).filter(ok)));
  $("#avgAle").textContent = fmt(avg(all.map(f => f.b).filter(ok)));
  $("#count").textContent = films.length + " film";
  const pairs = all.filter(f => ok(f.a) && ok(f.b));
  if(pairs.length){
    const pct = Math.max(0, Math.round(100 - avg(pairs.map(diff)) * 10));
    $("#agreeBar").style.width = pct + "%";
    $("#agreeTxt").textContent = "Sintonia " + pct + "%";
  }
  renderList(all);
  if(tab === "stats") renderStats(all);
}

function renderList(all){
  let rows = all.filter(f => f.title.toLowerCase().includes(query));
  if(sort === "recent") rows.sort((x, y) => (y.n || 0) - (x.n || 0));
  if(sort === "best") rows.sort((x, y) => mean(y) - mean(x));
  if(sort === "fight") rows.sort((x, y) => diff(y) - diff(x));
  const list = $("#list");
  if(!films.length){ list.innerHTML = `<li class="empty"><strong>Ancora nessun film</strong>Aggiungi il primo che avete visto insieme.</li>`; return; }
  if(!rows.length){ list.innerHTML = `<li class="empty"><strong>Nessun risultato</strong>Nessun titolo contiene “${esc(query)}”.</li>`; return; }
  list.innerHTML = rows.map(f => {
    const pa = ok(f.a), pb = ok(f.b);
    const lo = pa && pb ? Math.min(f.a, f.b) * 10 : 0, hi = pa && pb ? Math.max(f.a, f.b) * 10 : 0;
    const hasC = (f.commentAu || f.commentAle) ? ICON : "";
    return `<li><button class="row" data-id="${esc(f.id)}" aria-label="${esc(f.title)}, Aurorilus ${show(f.au)}, Ale ${show(f.ale)}. Apri">
      <div class="row-top"><span class="title">${esc(f.title)}${hasC}</span>
      <span class="scores"><span class="s-au">${esc(show(f.au))}</span><span class="s-ale">${esc(show(f.ale))}</span></span></div>
      <div class="track" aria-hidden="true">
        ${pa && pb ? `<span class="gap" style="left:${lo}%;width:${hi - lo}%"></span>` : ""}
        ${pa ? `<span class="dot au" style="left:${f.a * 10}%"></span>` : ""}
        ${pb ? `<span class="dot ale" style="left:${f.b * 10}%"></span>` : ""}
      </div></button></li>`;
  }).join("");
}

function rankList(items, val, sub){
  if(!items.length) return `<p class="note">Servono altri voti.</p>`;
  return `<ol class="rank">${items.map((f, i) => `<li><span class="pos">${i + 1}</span><span class="t">${esc(f.title)}</span><span class="v">${val(f)}${sub ? `<span class="sub">${sub(f)}</span>` : ""}</span></li>`).join("")}</ol>`;
}

function renderStats(all){
  const el = $("#stats");
  const pairs = all.filter(f => ok(f.a) && ok(f.b));
  if(!films.length){ el.innerHTML = `<div class="empty"><strong>Niente da contare</strong>Aggiungi qualche film e qui vedrete come votate.</div>`; return; }
  const coupleAvg = avg(all.map(mean).filter(x => x >= 0));
  const same = pairs.filter(f => diff(f) < .01).length;
  const auHi = pairs.filter(f => f.a - f.b > .01).length, aleHi = pairs.filter(f => f.b - f.a > .01).length;
  const sevAu = avg(all.map(f => f.a).filter(ok)), sevAle = avg(all.map(f => f.b).filter(ok));
  const strict = sevAu == null || sevAle == null || Math.abs(sevAu - sevAle) < .05 ? "Siete severi uguali." :
    (sevAu < sevAle ? "Aurorilus è più severa" : "Ale è più severo") + ", con " + fmt(Math.abs(sevAu - sevAle)) + " punti in meno di media.";
  const tot = Math.max(1, pairs.length);

  const byMean = all.filter(f => mean(f) >= 0).sort((x, y) => mean(y) - mean(x));
  const top = byMean.slice(0, 5), flop = byMean.slice(-5).reverse();
  const fights = pairs.filter(f => diff(f) > 0).sort((x, y) => diff(y) - diff(x)).slice(0, 5);
  const favAu = all.filter(f => ok(f.a)).sort((x, y) => y.a - x.a).slice(0, 3);
  const favAle = all.filter(f => ok(f.b)).sort((x, y) => y.b - x.b).slice(0, 3);

  el.innerHTML = `
  <div class="tiles">
    <div class="tile"><div class="v">${films.length}</div><div class="k">Film visti</div></div>
    <div class="tile"><div class="v">${fmt(coupleAvg)}</div><div class="k">Media di coppia</div></div>
    <div class="tile"><div class="v">${same}</div><div class="k">Stesso voto</div></div>
  </div>
  <div class="block">
    <h3>Chi vota più alto</h3>
    <p>${strict}</p>
    <div class="split" role="img" aria-label="Aurorilus più alta in ${auHi} film, pari in ${same}, Ale più alto in ${aleHi}">
      <i class="au" style="flex:${auHi / tot}"></i><i class="eq" style="flex:${same / tot}"></i><i class="ale" style="flex:${aleHi / tot}"></i>
    </div>
    <div class="split-leg"><span><b style="background:var(--au)"></b>Aurorilus più alta: ${auHi}</span><span>Pari: ${same}</span><span><b style="background:var(--ale)"></b>Ale più alto: ${aleHi}</span></div>
  </div>
  <div class="block">
    <h3>Come distribuite i voti</h3>
    <p>Quanti film per fascia di voto.</p>
    <div class="legend" aria-hidden="true" style="margin-left:0"><span><b style="background:var(--au)"></b>Aurorilus</span><span><b style="background:var(--ale)"></b>Ale</span></div>
    <div class="hist" id="hist"></div>
  </div>
  <div class="block"><h3>I più amati</h3><p>Media dei vostri due voti.</p>${rankList(top, f => fmt(mean(f)))}</div>
  <div class="block"><h3>I peggiori</h3>${rankList(flop, f => fmt(mean(f)))}</div>
  <div class="block"><h3>Dove avete litigato</h3><p>Differenza più grande tra i due voti.</p>${rankList(fights, f => fmt(diff(f)) + " pt", f => fmt(f.a) + " e " + fmt(f.b))}</div>
  <div class="two">
    <div class="block"><h3>Preferiti di Aurorilus</h3>${rankList(favAu, f => fmt(f.a))}</div>
    <div class="block"><h3>Preferiti di Ale</h3>${rankList(favAle, f => fmt(f.b))}</div>
  </div>`;
  drawHist(all);
}

function drawHist(all){
  const bins = Array.from({length:10}, (_, i) => ({lo:i, au:0, ale:0}));
  const put = (v, k) => { if(!ok(v)) return; bins[Math.min(9, Math.floor(v))][k]++; };
  all.forEach(f => { put(f.a, "au"); put(f.b, "ale"); });
  const max = Math.max(1, ...bins.map(b => Math.max(b.au, b.ale)));
  const W = 600, H = 200, pb = 24, step = W / 10, bw = (step - 14) / 2;
  const y = v => (H - pb) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Istogramma dei voti per fascia, da 0 a 10">`;
  s += `<line class="grid" x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}"/>`;
  const bar = (x, v, cls) => { if(!v) return ""; const top = y(v), h = H - pb - top, r = Math.min(4, h);
    return `<path d="M${x} ${H - pb}V${top + r}q0 -${r} ${r} -${r}h${bw - 2 * r}q${r} 0 ${r} ${r}V${H - pb}z" fill="var(--${cls})"/>`; };
  bins.forEach((b, i) => {
    const x0 = i * step + 6;
    s += bar(x0, b.au, "au") + bar(x0 + bw + 2, b.ale, "ale");
    s += `<text class="lbl" x="${i * step + step / 2}" y="${H - 6}" text-anchor="middle">${i}–${i + 1}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${i * step}" y="0" width="${step}" height="${H - pb}"/>`;
  });
  s += `</svg><div class="tip" id="tip"></div>`;
  const box = $("#hist"); box.innerHTML = s;
  const tip = $("#tip");
  box.querySelectorAll(".hit").forEach(r => {
    const i = +r.dataset.i, b = bins[i];
    const showTip = () => {
      const bb = r.getBoundingClientRect(), pb2 = box.getBoundingClientRect();
      tip.innerHTML = `<strong>Voti ${i}–${i + 1}</strong><br>Aurorilus ${b.au}, Ale ${b.ale}`;
      tip.style.left = (bb.left - pb2.left + bb.width / 2) + "px";
      tip.style.top = (y(Math.max(b.au, b.ale)) / H * pb2.height - 8) + "px";
      tip.classList.add("show");
    };
    r.addEventListener("pointerenter", showTip);
    r.addEventListener("pointerdown", showTip);
    r.addEventListener("pointerleave", () => tip.classList.remove("show"));
  });
}

// Tabs
function setTab(t){
  tab = t;
  $("#tabFilm").setAttribute("aria-selected", t === "film");
  $("#tabStats").setAttribute("aria-selected", t === "stats");
  $("#viewFilm").hidden = t !== "film"; $("#viewStats").hidden = t !== "stats";
  if(t === "stats") renderStats(enriched());
}
$("#tabFilm").addEventListener("click", () => setTab("film"));
$("#tabStats").addEventListener("click", () => setTab("stats"));

// Sheet
function openSheet(film){
  editing = film || null; confirmDel = false;
  $("#sheetTitle").textContent = film ? film.title : "Nuovo film";
  $("#fTitle").value = film ? film.title : "";
  $("#fAu").value = film && film.au != null ? film.au : "";
  $("#fAle").value = film && film.ale != null ? film.ale : "";
  $("#cAu").value = film && film.commentAu ? film.commentAu : "";
  $("#cAle").value = film && film.commentAle ? film.commentAle : "";
  $("#del").hidden = !film || !canWrite; $("#del").textContent = "Elimina film";
  $("#err").textContent = canWrite ? "" : "";
  $("#save").disabled = !canWrite;
  $("#scrim").classList.add("open");
  $("#form").scrollTop = 0;
  setTimeout(() => (film ? $("#fAu") : $("#fTitle")).focus({preventScroll:true}), 50);
}
function closeSheet(){ $("#scrim").classList.remove("open"); editing = null; }

document.querySelectorAll(".step button").forEach(b => b.addEventListener("click", () => {
  const inp = document.getElementById(b.dataset.t);
  let n = num(inp.value); if(!ok(n)) n = 6;
  else n = Math.round((n + parseFloat(b.dataset.d)) * 2) / 2;
  inp.value = String(Math.min(10, Math.max(0, n)));
}));

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  if(!canWrite) return;
  const title = $("#fTitle").value.trim(), au = $("#fAu").value.trim(), ale = $("#fAle").value.trim();
  if(!title){ $("#err").textContent = "Scrivi il titolo del film."; $("#fTitle").focus(); return; }
  if(!valid(au) || !valid(ale)){ $("#err").textContent = "I voti vanno da 0 a 10, per esempio 7.5, 7+ o 7/8."; return; }
  if(!db){ $("#err").textContent = "Archivio non raggiungibile: riprova tra poco."; return; }
  const data = { title, au: au || null, ale: ale || null, commentAu: $("#cAu").value.trim() || null, commentAle: $("#cAle").value.trim() || null };
  $("#save").disabled = true;
  try{
    if(editing){ await db.update(editing.id, data); toast("Salvato"); }
    else{
      const n = films.reduce((m, f) => Math.max(m, f.n || 0), 0) + 1;
      await db.add({ ...data, n }); toast("Film aggiunto");
    }
    closeSheet();
  }catch(err){
    if(err && err.code === "permission-denied") $("#err").textContent = "Firebase ha rifiutato il salvataggio: controlla le regole di Firestore.";
    else $("#err").textContent = "Salvataggio non riuscito. Riprova.";
  }finally{ $("#save").disabled = !canWrite; }
});

$("#del").addEventListener("click", async () => {
  if(!editing) return;
  if(!confirmDel){ confirmDel = true; $("#del").textContent = "Tocca di nuovo per eliminare"; return; }
  try{ await db.remove(editing.id); toast("Film eliminato"); closeSheet(); }
  catch{ $("#err").textContent = "Eliminazione non riuscita. Riprova."; }
});
$("#cancel").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", e => { if(e.target.id === "scrim") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("#scrim").classList.contains("open")) closeSheet(); });
$("#add").addEventListener("click", () => openSheet());
$("#list").addEventListener("click", e => { const b = e.target.closest(".row"); if(b) openSheet(films.find(f => f.id === b.dataset.id)); });
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
  sort = b.dataset.sort;
  document.querySelectorAll("[data-sort]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));

(async () => {
  const status = $("#status");
  const timer = setTimeout(() => { status.innerHTML = `<p class="note">I voti non si riescono a caricare. Controlla la connessione.</p>`; }, 10000);
  try{
    const app = initializeApp({
      apiKey: "AIzaSyBTtlG8wiIf1FSG33-nLr_twq9gjYiNyOc",
      authDomain: "cinema-a757e.firebaseapp.com",
      projectId: "cinema-a757e",
      storageBucket: "cinema-a757e.firebasestorage.app",
      messagingSenderId: "72368731731",
      appId: "1:72368731731:web:bbbcb208b2a9f4ec3e38a6"
    });
    const fs = getFirestore(app);
    db = {
      update: (id, data) => updateDoc(doc(fs, "films", id), data),
      add: data => addDoc(collection(fs, "films"), data),
      remove: id => deleteDoc(doc(fs, "films", id))
    };
    let seeded = false;
    onSnapshot(collection(fs, "films"), snap => {
      // Primo avvio in assoluto: carica i film iniziali una volta sola
      if(!snap.metadata.fromCache && !seeded && !snap.docs.some(d => d.id === "_seed")){
        seeded = true;
        const batch = writeBatch(fs);
        SEED.forEach((r, i) => batch.set(doc(fs, "films", "f" + String(i + 1).padStart(2, "0")), { title: r[0], au: r[1], ale: r[2], n: i + 1 }));
        batch.set(doc(fs, "films", "_seed"), { title: "_seed" });
        batch.commit().catch(() => {});
      }
      films = snap.docs.filter(d => d.id !== "_seed").map(d => ({ id: d.id, ...d.data() })).filter(f => f.title);
      try{ localStorage.setItem("cinema-films", JSON.stringify(films)); }catch{}
      clearTimeout(timer); status.innerHTML = "";
      render();
    }, err => {
      clearTimeout(timer);
      status.innerHTML = `<p class="note">${err.code === "permission-denied" ? "Firebase rifiuta l'accesso: controlla di aver pubblicato le regole di Firestore." : "Collegamento ai voti interrotto. Ricarica la pagina."}</p>`;
    });
  }catch(err){
    clearTimeout(timer);
    status.innerHTML = `<p class="note">${err && err.code === "permission-denied" ? "Firebase rifiuta l'accesso: controlla di aver pubblicato le regole di Firestore." : "Non riesco a collegarmi a Firebase. Ricarica la pagina."}</p>`;
    render();
  }
})();
